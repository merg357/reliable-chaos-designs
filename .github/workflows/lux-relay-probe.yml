name: Lux Relay Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Lux public OAuth and MCP metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          for path in \
            '/health' \
            '/healthz' \
            '/.well-known/oauth-protected-resource' \
            '/.well-known/oauth-authorization-server' \
            '/.well-known/openid-configuration' \
            '/mcp'; do
            name="$(printf '%s' "$path" | sed 's#^/##; s#[/.]#_#g')"
            [ -n "$name" ] || name=root
            curl -sS -i --max-time 20 "https://mcp.scanforlife.net${path}" > "probe/${name}.txt" || true
          done
          echo '=== PROBE SUMMARY ==='
          for f in probe/*.txt; do
            echo "--- $(basename "$f") ---"
            sed -n '1,100p' "$f"
          done

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: lux-relay-probe
          path: probe
          if-no-files-found: error
