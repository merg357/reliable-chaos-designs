name: VentureOS Lux Recovery Relay

on:
  workflow_dispatch:
    inputs:
      action:
        description: Recovery action
        required: true
        type: choice
        options:
          - health
          - verify-conway-v3
          - deploy-conway-main
      sha:
        description: Exact 40-character ventureos-conway origin/main SHA; required only for deploy-conway-main
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ventureos-lux-recovery
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate request
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            health|verify-conway-v3) ;;
            deploy-conway-main)
              [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "deploy-conway-main requires an exact 40-character SHA" >&2; exit 2; }
              ;;
            *) echo "unsupported action" >&2; exit 2 ;;
          esac

      - name: Request short-lived GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          response="$(curl -fsS --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ventureos-deploy")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Call Lux recovery bridge
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ACTION: ${{ inputs.action }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({"action": os.environ["ACTION"], "sha": os.environ.get("SHA", "")}))
          PY
          )"
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 2100 -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'content-type: application/json' \
            --data "$payload" \
            https://mcp.scanforlife.net/github-deploy/v1/action)"
          cat "$tmp"
          echo
          test "$code" = "200" || { echo "Lux bridge returned HTTP $code" >&2; exit 1; }
